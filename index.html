<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINGLISH — караоке для англійської</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Abril+Fatface&family=Black+Ops+One&family=Bowlby+One&family=Permanent+Marker&family=Rubik+Mono+One&family=Special+Elite&family=Onest:wght@400;500;700&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--deep:#14062e;--violet:#7b3cff;--violet2:#5a22d6;--lilac:#cdbcff;--acid:#e8ff4a;--fill:#eefc8c;--paper:#f3ecdc;--ink:#120a1f;
  --fs:clamp(26px,6.6vw,52px);--px:0;--py:0;--beat:0;--ease:cubic-bezier(.2,.9,.25,1.15)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#2a1060 url(bg_violet.jpg) center top/cover fixed;color:var(--paper);font-family:Onest,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
.hidden{display:none!important}

/* ---------- ambient layers ---------- */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fx .blob{position:absolute;mix-blend-mode:screen;animation:float 22s ease-in-out infinite alternate}
#fx .blob{aspect-ratio:1;border-radius:50%;filter:blur(40px)}
#fx .bv{width:min(110vw,900px);left:-30%;top:-8%;opacity:calc(.5 + var(--beat)*.35);background:radial-gradient(circle,#7b3cff 0%,rgba(123,60,255,.4) 40%,transparent 68%)}
#fx .bb{width:min(80vw,700px);right:-30%;top:38%;animation-duration:28s;opacity:.45;background:radial-gradient(circle,#3b5bff 0%,transparent 65%)}
#fx .bg{width:min(70vw,560px);left:-20%;bottom:-14%;animation-duration:31s;opacity:.28;background:radial-gradient(circle,#e8ff4a 0%,transparent 62%)}
@keyframes float{to{transform:translate(8vw,5vh) rotate(8deg) scale(1.1)}}
#grain{position:fixed;inset:-60px;z-index:40;pointer-events:none;background:url(grain.png);opacity:.33;mix-blend-mode:overlay;animation:grain .7s steps(3) infinite}
@keyframes grain{0%{transform:translate(0,0)}33%{transform:translate(-22px,14px)}66%{transform:translate(17px,-19px)}100%{transform:translate(-9px,-6px)}}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(10,2,26,.6) 100%)}
.screen{position:relative;z-index:2}
.shadow{filter:drop-shadow(4px 7px 5px rgba(0,0,0,.45))}

/* ---------- draw zone (first screen) ---------- */
#draw{position:relative;min-height:100svh;padding:20px 16px 40px;touch-action:pan-y;overflow:hidden;cursor:crosshair}
#paint{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#draw .inner{position:relative;z-index:1;max-width:760px;margin:0 auto;pointer-events:none}
.logo{position:relative;width:min(100%,640px);margin:6px auto 0;animation:slam .9s var(--ease) both .1s}
.logo img.word{animation:wob 6s ease-in-out infinite 1s}
@keyframes slam{0%{opacity:0;transform:scale(1.6) rotate(-6deg);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:none}}
@keyframes wob{50%{transform:rotate(-1.2deg) translateY(-3px)}}
.logo .star{position:absolute;right:-5%;top:-42%;width:17%;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.collage{position:relative;width:100%;aspect-ratio:1/.92;margin-top:8px}
.layer{position:absolute;left:var(--x);top:var(--y);width:var(--w);
  translate:calc(var(--px)*var(--z)*1px) calc(var(--py)*var(--z)*1px);transition:translate .5s cubic-bezier(.2,.8,.2,1);
  animation:drop .9s var(--ease) both;animation-delay:var(--d)}
.layer>img{transform:rotate(var(--r))}
@keyframes drop{0%{opacity:0;transform:translateY(-60px) scale(1.3) rotate(-14deg)}100%{opacity:1;transform:none}}
.layer.float>img{animation:bob 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes bob{50%{transform:rotate(calc(var(--r) + 3deg)) translateY(-6px)}}

.hint{position:relative;z-index:2;width:fit-content;margin:6px auto 0;padding:9px 18px 10px;background:url(strip_lilac.webp) center/100% 100%;color:var(--ink);
  font:13px 'Special Elite',monospace;transform:rotate(-2deg);animation:pulse 2.4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:rotate(1deg) scale(1.05)}}
.tag{position:relative;margin:22px auto 0;width:min(92%,520px);aspect-ratio:1100/170;background:url(strip_yellow.webp) center/100% 100% no-repeat;
  display:flex;align-items:center;justify-content:center;transform:rotate(-2deg);filter:drop-shadow(4px 6px 3px rgba(0,0,0,.4));animation:drop .9s var(--ease) both 1.1s}
.tag span{font:clamp(14px,3.9vw,20px) 'Special Elite',monospace;color:var(--ink)}
.tag .tape{position:absolute;width:24%;left:-6%;top:-28%;transform:rotate(-24deg)}
.scrolldown{position:absolute;z-index:2;left:50%;bottom:14px;translate:-50% 0;font:700 11px Unbounded;letter-spacing:.2em;color:var(--lilac);animation:nudge 1.6s ease-in-out infinite;pointer-events:none}
@keyframes nudge{50%{transform:translateY(6px)}}

/* ---------- marquee ---------- */
.marquee{position:relative;z-index:3;margin:-20px -20px 0;height:64px;background:url(marquee.webp) center/100% 100%;transform:rotate(-2.5deg);overflow:hidden;
  display:flex;align-items:center;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.marquee .track{display:flex;white-space:nowrap;animation:marq 22s linear infinite}
.marquee span{font:18px 'Rubik Mono One',sans-serif;color:var(--ink);padding-right:28px}
.marquee span i{font-style:normal;color:var(--violet2)}
@keyframes marq{to{transform:translateX(-50%)}}
.marquee.m2{background-image:url(strip_ink.webp);transform:rotate(1.6deg);margin-top:-30px;z-index:2;height:54px}
.marquee.m2 span{color:var(--acid);font-size:15px}
.marquee.m2 .track{animation-direction:reverse;animation-duration:30s}

/* ---------- home sections ---------- */
#home{padding-bottom:90px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.sec{margin-top:56px;position:relative}
.sec-h{height:clamp(46px,11vw,72px);width:auto;margin-bottom:12px;margin-left:-6px;position:relative;z-index:4}
.reveal{opacity:0;transform:translateY(50px) rotate(var(--rr,-3deg)) scale(.96);transition:opacity .7s,transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal .sec-h{transform:scale(1.5) rotate(-6deg);opacity:0;transition:transform .7s var(--ease) .15s,opacity .4s .15s}
.reveal.in .sec-h{transform:none;opacity:1}
.paperbox{position:relative;background:url(card_cream.webp) center/100% 100% no-repeat;padding:clamp(18px,4.5vw,28px) clamp(18px,5vw,30px);filter:drop-shadow(5px 8px 4px rgba(0,0,0,.45));color:var(--ink)}
.searchbox{display:flex;gap:8px;transform:rotate(.7deg)}
.searchbox input{flex:1;min-width:0;border:0;border-bottom:2px dashed rgba(18,10,31,.45);background:transparent;font:500 17px Onest;color:var(--ink);padding:10px 4px;outline:none}
.searchbox input::placeholder{color:rgba(18,10,31,.5)}
.searchbox button{background:url(paper_violet.jpg) center/cover;color:var(--paper);font:800 14px Unbounded;padding:0 14px;clip-path:polygon(2% 6%,98% 0,100% 94%,0 100%)}
.note{margin-top:14px;font-size:13px;color:var(--lilac);text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:560px}
.ticket{display:flex;align-items:center;gap:16px;width:100%;text-align:left;transform:rotate(-1.4deg);transition:transform .35s var(--ease)}
.ticket:hover{transform:rotate(1deg) scale(1.03)}
.ticket:active{transform:scale(.97)}
.ticket .tape{position:absolute;width:110px}
.ticket .tape.t1{left:-14px;top:-16px;transform:rotate(-30deg)}
.ticket .tape.t2{right:-12px;bottom:-14px;transform:rotate(-24deg)}
.play{flex:none;width:64px;height:64px;border-radius:50%;background:url(paper_yellow.jpg) center/cover;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--ink),3px 4px 0 var(--ink);animation:throb 1.333s ease-in-out infinite}
@keyframes throb{0%,100%{transform:scale(1)}12%{transform:scale(1.09)}}
.play svg{width:22px;fill:var(--ink);margin-left:4px}
.ticket .title img{height:clamp(34px,8.5vw,52px);width:auto;margin-left:-6px}
.ticket p{font:500 13px Onest;color:rgba(18,10,31,.7);margin-top:4px}
.stamp{position:absolute;right:16px;top:-14px;font:20px 'Black Ops One';color:var(--violet2);border:3px solid var(--violet2);padding:2px 10px;transform:rotate(9deg);background:rgba(243,236,220,.85);mix-blend-mode:multiply}
.own{position:relative;background:url(strip_ink.webp) center/100% 100% no-repeat;padding:30px 24px;display:grid;gap:10px;filter:drop-shadow(5px 8px 4px rgba(0,0,0,.45))}
.own .deco-star{position:absolute;right:-6px;bottom:-26px;width:76px;animation:spin 12s linear infinite}
.own label{font:700 12px Unbounded;letter-spacing:.04em;color:var(--acid)}
.own textarea{width:100%;min-height:90px;background:rgba(243,236,220,.08);color:var(--paper);border:1px dashed rgba(205,188,255,.45);padding:10px;font:14px/1.4 'Special Elite',ui-monospace,monospace;resize:vertical}
.own input[type=file]{color:var(--lilac);font-size:14px}
.btn{justify-self:start;background:url(paper_yellow.jpg) center/cover;color:var(--ink);font:800 15px Unbounded;padding:14px 20px;clip-path:polygon(0 8%,97% 0,100% 90%,3% 100%);margin-top:4px;transition:transform .25s var(--ease)}
.btn:hover{transform:rotate(-2deg) scale(1.05)}

/* loading overlay */
#loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(14,4,34,.7);backdrop-filter:blur(4px)}
#loading div{padding:16px 24px;background:url(strip_yellow.webp) center/100% 100%;color:var(--ink);font:15px 'Special Elite',monospace;animation:pulse 1s ease-in-out infinite}

/* ---------- player ---------- */
#player{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#ppaint{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55;pointer-events:none}
.deco{position:fixed;pointer-events:none;z-index:1}
.deco.d1{width:min(42vw,340px);left:-8vw;bottom:8vh;opacity:.35;transform:rotate(-10deg)}
.deco.d2{width:min(46vw,380px);right:-12vw;top:14vh;opacity:.28;transform:rotate(8deg)}
.topbar{position:relative;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 14px 6px;flex-wrap:wrap;animation:drop .7s var(--ease) both}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:url(paper_cream.jpg) center/cover;color:var(--ink);font:800 20px Unbounded;flex:none;
  clip-path:polygon(4% 0,100% 6%,96% 100%,0 94%)}
.titlebox{flex:1;min-width:0}
#ptitle img{height:clamp(32px,8vw,48px);width:auto;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.4))}
#partist{font:500 12px Onest;color:var(--lilac);margin-top:2px;padding-left:4px;text-shadow:0 1px 2px #000}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;width:100%}
.seg{display:flex;gap:4px}
.seg button,.chip{padding:8px 11px;font:700 11px Unbounded;color:var(--ink);background:url(paper_cream.jpg) center/cover;clip-path:polygon(0 6%,100% 0,97% 100%,3% 94%);opacity:.85;transition:transform .2s var(--ease)}
.seg button:active,.chip:active{transform:scale(.92)}
.seg button.on{background-image:url(paper_yellow.jpg);opacity:1}
.chip.on{background-image:url(paper_violet.jpg);color:var(--paper);opacity:1}
.spacer{flex:1}
#stage{position:relative;z-index:2;flex:1;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 15%,#000 80%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 15%,#000 80%,transparent 100%)}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 40% 42%,rgba(12,3,30,.6),rgba(12,3,30,.2) 70%,transparent)}
#lyrics{position:relative;list-style:none;padding:0 7vw;max-width:980px;margin:0 auto;transition:transform .8s cubic-bezier(.2,.8,.2,1);will-change:transform}
.line{position:relative;padding:.32em 0 .42em;font-size:var(--fs);transform-origin:left center;transform:scale(.82) translateX(-.2em);opacity:.32;filter:blur(.6px);
  transition:transform .7s var(--ease),opacity .5s,filter .5s}
.line.near{opacity:.55;filter:none}
.line.past{opacity:.24}
.line.active{transform:scale(1);opacity:1;filter:none}
.line.active::before{content:"";position:absolute;left:-.8em;top:.34em;width:.62em;height:.62em;background:url(star_yellow.webp) center/contain no-repeat;
  animation:spin 5s linear infinite;scale:calc(1 + var(--beat)*.35)}
.en{font:700 1em/1.14 Unbounded;letter-spacing:-.01em;color:rgba(244,238,255,.92);text-shadow:0 2px 10px rgba(10,2,26,.6)}
.w{display:inline-block;cursor:pointer;margin-right:.24em}
.line.past .en{color:rgba(238,252,140,.8)}
.line.active .w{color:transparent;-webkit-background-clip:text;background-clip:text;text-shadow:none;
  background-image:linear-gradient(90deg,var(--fill) calc(var(--w,0)*112% - 12%),rgba(245,240,255,.62) calc(var(--w,0)*112%))}
.line.active .en{filter:drop-shadow(0 2px 8px rgba(10,2,26,.7))}
.w.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:none}35%{transform:translateY(-.12em) scale(1.12) rotate(-2deg)}100%{transform:none}}
.tr{display:inline-block;font:500 .44em/1.35 Onest;color:var(--ink);margin-top:.45em;padding:.18em .6em .22em;cursor:pointer;background:url(strip_lilac.webp) center/100% 100% no-repeat;opacity:.55;transform:rotate(-.6deg)}
.line.active .tr{opacity:1;background-image:url(strip_yellow.webp);animation:trin .6s var(--ease)}
@keyframes trin{from{transform:rotate(-6deg) scale(.7);opacity:0}}
.tr:empty{display:none}
body.notr .tr{display:none}
.intro{font:700 var(--fs) Unbounded;color:var(--lilac);opacity:.6;letter-spacing:.3em;padding:.3em 0}
.bottombar{position:relative;z-index:3;display:flex;align-items:center;gap:14px;margin:0 6px 10px;padding:22px 20px 22px 16px;background:url(strip_ink.webp) center/100% 100% no-repeat;animation:drop .7s var(--ease) both .2s}
#playbtn{flex:none;width:66px;height:66px;border-radius:50%;background:url(paper_yellow.jpg) center/cover;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--ink),3px 4px 0 var(--violet);scale:calc(1 + var(--beat)*.08);transition:transform .2s var(--ease)}
#playbtn:active{transform:scale(.9)}
#playbtn svg{width:24px;fill:var(--ink)}
.prog{flex:1;display:grid;gap:6px}
.time{display:flex;justify-content:space-between;align-items:center;font:500 12px 'Special Elite',monospace;color:var(--lilac)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:url(paper_violet.jpg) center/cover;outline:none;clip-path:polygon(0 20%,100% 0,100% 80%,0 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:url(star_yellow.webp) center/contain no-repeat}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;background:url(star_yellow.webp) center/contain no-repeat}
#seekwrap{padding:6px 0}
#sync{display:flex;gap:6px;align-items:center}
body.focus .topbar .hide-focus{display:none}
#tip{position:fixed;z-index:60;background:url(paper_yellow.jpg) center/cover;color:var(--ink);padding:12px 16px;font:700 15px Onest;max-width:240px;
  clip-path:polygon(0 5%,100% 0,97% 100%,2% 95%);transform:rotate(-2deg) scale(.8);opacity:0;pointer-events:none;transition:opacity .2s,transform .3s var(--ease)}
#tip.show{opacity:1;transform:rotate(-2deg) scale(1)}
#tip b{font:800 13px Unbounded;display:block;margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translateX(-50%) translateY(250%);opacity:0;background:url(paper_cream.jpg) center/cover;color:var(--ink);
  padding:16px 20px;font:500 15px Onest;max-width:92vw;clip-path:polygon(0 4%,100% 0,98% 100%,1% 96%);transition:transform .45s var(--ease),opacity .3s}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.cutout{display:flex;flex-wrap:wrap;align-items:center;gap:.06em;font-size:clamp(18px,4.6vw,26px);filter:drop-shadow(3px 4px 0 rgba(0,0,0,.45))}
.cl{display:inline-block;padding:.08em .14em .02em;line-height:1;transform:rotate(var(--r)) translateY(var(--y))}
.cl.sp{width:.35em;padding:0}
#results{display:grid;gap:12px;margin-top:16px}
.res{position:relative;display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:url(card_cream.webp) center/100% 100% no-repeat;color:var(--ink);
  padding:16px 18px;filter:drop-shadow(4px 6px 3px rgba(0,0,0,.4));transform:rotate(var(--rr,0deg));transition:transform .3s var(--ease);animation:drop .6s var(--ease) both;animation-delay:var(--d,0s)}
.res:hover{transform:rotate(0) scale(1.02)}
.res b{font:800 15px Unbounded;display:block;line-height:1.2}
.res small{font:500 13px Onest;opacity:.7}
.res .tagl{flex:none;font:11px 'Special Elite',monospace;padding:4px 8px;background:url(paper_yellow.jpg) center/cover}
.res .tagl.no{background-image:url(paper_violet.jpg);color:var(--paper)}
.res .pl{flex:none;width:44px;height:44px;border-radius:50%;background:url(paper_violet.jpg) center/cover;display:grid;place-items:center}
.res .pl svg{width:16px;fill:var(--paper);margin-left:3px}
.msg{font:15px 'Special Elite',monospace;color:var(--ink);background:url(strip_yellow.webp) center/100% 100%;padding:12px 18px;width:fit-content;animation:pulse 1.2s ease-in-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips .lab{width:100%;font:700 11px Unbounded;color:var(--acid);letter-spacing:.06em}
.chips button{padding:8px 12px;font:600 13px Onest;color:var(--ink);background:url(paper_cream.jpg) center/cover;clip-path:polygon(0 6%,100% 0,97% 100%,3% 94%);transition:transform .2s var(--ease)}
.chips button:nth-child(3n){background-image:url(paper_yellow.jpg)}
.chips button:hover{transform:rotate(-2deg) scale(1.05)}
#status{position:relative;z-index:3;min-height:0;text-align:center;font:13px 'Special Elite',monospace;color:var(--acid);padding:0 16px}
#ytwrap{position:fixed;z-index:6;left:var(--yx,calc(100vw - 230px));top:var(--yy,calc(100dvh - 300px));width:var(--yw,210px);aspect-ratio:16/9;padding:5px;
  background:url(paper_cream.jpg) center/cover;filter:drop-shadow(4px 6px 6px rgba(0,0,0,.55));transform:rotate(1.5deg);transition:transform .3s var(--ease)}
#ytwrap.drag{transform:rotate(0) scale(1.02)}
#ytwrap.mini{opacity:.0001;pointer-events:none}
.ythandle{position:absolute;left:12px;top:-20px;padding:3px 12px 4px;font:11px 'Special Elite',monospace;color:var(--ink);background:url(strip_yellow.webp) center/100% 100%;cursor:grab;touch-action:none;user-select:none;transform:rotate(-2deg)}
.ygrip{position:absolute;right:-8px;bottom:-8px;width:26px;height:26px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 45%,var(--ink) 45% 52%,transparent 52% 62%,var(--ink) 62% 69%,transparent 69%),url(paper_yellow.jpg) center/cover;clip-path:polygon(100% 0,100% 100%,0 100%)}
body.dragging iframe{pointer-events:none}
body.dragging{user-select:none}
#backNow{position:fixed;z-index:7;left:50%;bottom:122px;translate:-50% 0;padding:10px 16px;font:700 12px Unbounded;color:var(--ink);background:url(paper_yellow.jpg) center/cover;
  clip-path:polygon(0 8%,100% 0,97% 100%,3% 92%);animation:drop .4s var(--ease)}
#stage{touch-action:none}
#stage.browsing .line{opacity:.72;filter:none;transform:scale(.9);cursor:pointer}
#stage.browsing .line.active{opacity:1;transform:scale(1)}
#stage.browsing .line:hover .en{color:var(--fill)}
#stage.browsing .line::after{content:"▶";position:absolute;left:-.85em;top:.42em;font-size:.4em;color:var(--acid)}
#stage.browsing .line.active::after{display:none}
#recs{position:fixed;z-index:8;left:8px;right:8px;bottom:112px;padding:16px 14px 18px;background:url(strip_ink.webp) center/100% 100%;filter:drop-shadow(0 -6px 10px rgba(0,0,0,.45));animation:sheet .5s var(--ease)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.rhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.rhead b{font:800 13px Unbounded;color:var(--acid);letter-spacing:.06em}
.rhead button{color:var(--lilac);font-size:18px}
.rrow{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 6px;scroll-snap-type:x mandatory}
.rec{flex:none;width:128px;text-align:left;scroll-snap-align:start;transform:rotate(var(--rr,0deg));transition:transform .25s var(--ease)}
.rec:hover{transform:rotate(0) scale(1.05)}
.rec img{width:128px;height:128px;object-fit:cover;padding:5px;background:url(paper_cream.jpg) center/cover;filter:grayscale(.15) contrast(1.05)}
.rec b{display:block;font:700 12px Onest;color:var(--paper);margin-top:6px;line-height:1.25}
.rec small{font:12px Onest;color:var(--lilac)}
.rmsg{font:13px 'Special Elite',monospace;color:var(--lilac);padding:6px}

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- cut-out letters ---------- */
const FONTS=["Anton","'Bowlby One'","'Abril Fatface'","'Special Elite'","'Rubik Mono One'","'Black Ops One'","'Permanent Marker'","Unbounded"];
const SKINS=[["#f3ecdc","#120a1f"],["#e8ff4a","#120a1f"],["#120a1f","#f3ecdc"],["#7b3cff","#f3ecdc"],["#cdbcff","#120a1f"],["#f3ecdc","#5a22d6"],["#2b1166","#e8ff4a"]];
function cutout(el,text,seed){
  const r=rng(seed||text.length*97+text.charCodeAt(0));el.innerHTML='';let prev=-1;
  for(const ch of text){
    const s=document.createElement('span');
    if(ch===' '){s.className='cl sp';el.appendChild(s);continue}
    let k;do{k=Math.floor(r()*SKINS.length)}while(k===prev);prev=k;
    const [bg,fg]=SKINS[k];const p=()=>(r()*7).toFixed(1);
    s.className='cl';s.textContent=ch;
    s.style.cssText=`background:${bg};color:${fg};font-family:${FONTS[Math.floor(r()*FONTS.length)]};--r:${(r()*14-7).toFixed(1)}deg;--y:${(r()*.12-.06).toFixed(2)}em;`+
      `clip-path:polygon(${p()}% ${p()}%,${100-p()}% ${p()}%,${100-p()}% ${100-p()}%,${p()}% ${100-p()}%)`;
    if(r()<.25)s.style.textTransform='lowercase';
    el.appendChild(s);
  }
}

/* ================= audio: demo rendered to a real audio file ================= */
// WebAudio is muted by the iPhone silent switch, an <audio> element is not.
// So the demo track is rendered offline into a WAV and played like any song.
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
async function renderDemo(dur){
  const SR=22050,O=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const c=new O(1,Math.ceil(SR*dur),SR);
  const master=c.createGain();master.gain.value=.6;
  const comp=c.createDynamicsCompressor();master.connect(comp);comp.connect(c.destination);
  const nb=c.createBuffer(1,SR*.5,SR),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const env=(node,w,a,peak,rel,dest=master)=>{const g=c.createGain();g.gain.setValueAtTime(0,w);g.gain.linearRampToValueAtTime(peak,w+a);g.gain.exponentialRampToValueAtTime(.0001,w+a+rel);node.connect(g);g.connect(dest);return g};
  const beat=60/90,CH=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
  const end=dur-1.5;
  for(let i=0;i*beat<end;i++){
    const w=i*beat,inBar=i%4,intro=i<6,ch=CH[Math.floor(i/8)%4];
    if(i%8===0)ch.forEach(f=>{const o=c.createOscillator();o.type='triangle';o.frequency.value=f;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1300;o.connect(lp);env(lp,w,.4,.05,8*beat);o.start(w);o.stop(w+8*beat+.5)});
    [0,.5].forEach(o2=>{const s=c.createBufferSource();s.buffer=nb;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;s.connect(hp);env(hp,w+o2*beat,.002,o2?.06:.1,.05);s.start(w+o2*beat);s.stop(w+o2*beat+.1)});
    if(intro)continue;
    if(inBar===0||inBar===2){const o=c.createOscillator();o.frequency.setValueAtTime(140,w);o.frequency.exponentialRampToValueAtTime(42,w+.15);env(o,w,.003,.9,.28);o.start(w);o.stop(w+.35)}
    if(inBar===1||inBar===3){const s=c.createBufferSource();s.buffer=nb;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1600;bp.Q.value=.8;s.connect(bp);env(bp,w,.002,.32,.16);s.start(w);s.stop(w+.25)}
    const o=c.createOscillator();o.type='sawtooth';o.frequency.value=ch[0]/2;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;o.connect(lp);env(lp,w,.01,.2,beat*.8);o.start(w);o.stop(w+beat);
  }
  // lead melody that follows the lyrics (one note per word)
  const SCALE=[220,261.6,293.7,329.6,392,440,523.3,587.3];
  DEMO.lines.forEach((l,li)=>{
    const words=l.en.split(/\s+/),r=rng(li%8+3),chorus=(li%8)>=4,span=2.9;
    words.forEach((wd,k)=>{
      const t=l.t+k*span/words.length,len=span/words.length*.9;
      let idx=Math.floor(r()*5)+(chorus?2:0);if(k===words.length-1)idx=chorus?5:2;
      const f=SCALE[Math.min(7,idx)];
      const o=c.createOscillator();o.type='square';o.frequency.value=f;
      const v=c.createOscillator(),vg=c.createGain();v.frequency.value=5.5;vg.gain.value=f*.012;v.connect(vg);vg.connect(o.frequency);
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1900;o.connect(lp);
      env(lp,t,.03,.07,len);o.start(t);o.stop(t+len+.1);v.start(t);v.stop(t+len+.1);
    });
  });
  const buf=await c.startRendering(),d=buf.getChannelData(0);
  const ab=new ArrayBuffer(44+d.length*2),dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');dv.setUint32(4,36+d.length*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,d.length*2,true);
  for(let i=0;i<d.length;i++)dv.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
  return URL.createObjectURL(new Blob([ab],{type:'audio/wav'}));
}

class FilePlayer{
  constructor(url,fallback,keep){this.a=new Audio();this.a.src=url;this.a.preload='auto';this.a.setAttribute('playsinline','');this.fallback=fallback;this.keep=keep}
  get duration(){return isFinite(this.a.duration)&&this.a.duration>0?this.a.duration:this.fallback}
  get playing(){return !this.a.paused}

}

/* ================= painter: gradient that appears where you draw ================= */
class Painter{
  constructor(cv,{auto=true,interactive=true,strength=1}={}){
    this.cv=cv;this.ctx=cv.getContext('2d');this.auto=auto;this.strength=strength;
    this.mask=document.createElement('canvas');this.mx=this.mask.getContext('2d');
    this.grad=document.createElement('canvas');this.gx=this.grad.getContext('2d');
    this.star=new Image();this.star.src='star_yellow.webp';
    this.parts=[];this.last=null;this.idle=1e5;this.t=0;this.ghost=null;this.running=false;
    this.resize();addEventListener('resize',()=>this.resize());
    if(interactive){
      const el=cv.parentElement;
      el.addEventListener('pointermove',e=>this.move(e));
      el.addEventListener('pointerdown',e=>{this.last=null;this.move(e)});
      el.addEventListener('pointerleave',()=>this.last=null);
    }
  }
  resize(){const r=this.cv.getBoundingClientRect(),s=.5;this.k=s;
    this.w=Math.max(2,Math.round(r.width*s));this.h=Math.max(2,Math.round(r.height*s));
    [this.cv,this.mask].forEach(c=>{c.width=this.w;c.height=this.h});this.grad.width=Math.ceil(this.w/4);this.grad.height=Math.ceil(this.h/4)}
  move(e){const r=this.cv.getBoundingClientRect();this.stroke((e.clientX-r.left)*this.k,(e.clientY-r.top)*this.k,true)}
  stroke(x,y,user){
    if(user){this.idle=0;this.ghost=null}
    const now=performance.now();
    if(this.last){
      const dx=x-this.last.x,dy=y-this.last.y,dist=Math.hypot(dx,dy),v=dist/Math.max(8,now-this.last.t)*16;
      const rad=Math.min(95,30+v*1.6)*(this.w/380+.4)*.55;
      const n=Math.ceil(dist/(rad*.25));
      for(let i=1;i<=n;i++)this.dab(this.last.x+dx*i/n,this.last.y+dy*i/n,rad);
      if(v>14&&Math.random()<.35&&this.parts.length<40)this.parts.push({x,y,vx:dx*.06+(Math.random()-.5)*2,vy:dy*.06-1.5,a:1,s:6+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.3});
    }
    this.last={x,y,t:now};
  }
  dab(x,y,r){const g=this.mx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(1,'rgba(255,255,255,0)');this.mx.fillStyle=g;this.mx.beginPath();this.mx.arc(x,y,r,0,7);this.mx.fill()}
  burst(power){ // used by the player on beats
    const x=Math.random()*this.w,y=Math.random()*this.h,r=(60+power*90)*(this.w/380+.4)*.5;
    for(let i=0;i<3;i++)this.dab(x+(Math.random()-.5)*r,y+(Math.random()-.5)*r,r);
  }
  paintGradient(){
    const g=this.gx,W=this.grad.width,H=this.grad.height,t=this.t;
    g.fillStyle='#4316c4';g.fillRect(0,0,W,H);
    const spots=[['123,60,255',.5+.4*Math.sin(t*.7),.4+.35*Math.cos(t*.5),.75],['59,91,255',.5+.45*Math.cos(t*.43),.6+.3*Math.sin(t*.61),.7],
      ['232,255,74',.5+.42*Math.sin(t*.37+2),.5+.4*Math.sin(t*.53+1),.5],['205,140,255',.5+.4*Math.cos(t*.29+4),.3+.4*Math.cos(t*.47+3),.6],['20,230,200',.5+.4*Math.sin(t*.23+5),.7+.25*Math.cos(t*.31),.35]];
    g.globalCompositeOperation='source-over';
    spots.forEach(([c,x,y,s])=>{const R=Math.max(W,H)*s,gr=g.createRadialGradient(x*W,y*H,0,x*W,y*H,R);gr.addColorStop(0,`rgba(${c},.9)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(0,0,W,H)});
    g.globalCompositeOperation='source-over';
  }
  frame(dt){
    this.t+=dt*.001;this.idle+=dt;
    // ghost painter when nobody draws
    if(this.auto&&this.idle>700){
      if(!this.ghost)this.ghost={t:0,ph:Math.random()*6,cx:.3+Math.random()*.4,cy:.25+Math.random()*.5};
      const G=this.ghost;G.t+=dt*.001;
      const x=(G.cx+.32*Math.sin(G.t*1.7+G.ph)*Math.cos(G.t*.6))*this.w,y=(G.cy+.22*Math.sin(G.t*2.3+G.ph))*this.h;
      this.stroke(x,y,false);if(G.t>4.6){this.ghost=null;this.idle=300;this.last=null}
    }
    // fade the drawing slowly
    this.mx.globalCompositeOperation='destination-out';this.mx.fillStyle=`rgba(0,0,0,${.012*dt/16})`;this.mx.fillRect(0,0,this.w,this.h);this.mx.globalCompositeOperation='source-over';
    this.paintGradient();

const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de'];
const INV=['https://inv.nadeko.net','https://invidious.nerdvpn.de','https://yewtu.be'];
async function findVideos(artist,track,dur){
  const q=`${artist} ${track}`;let out=[];
  const key=store.get('ytkey','');
  if(key){try{const r=await getJSON(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=6&q=${encodeURIComponent(q)}&key=${key}`);
    out=r.items.map(i=>({id:i.id.videoId,title:i.snippet.title,len:0}))}catch(e){}}
  if(!out.length)for(const h of PIPED){try{const r=await getJSON(`${h}/search?q=${encodeURIComponent(q)}&filter=videos`,6000);
    out=(r.items||[]).filter(i=>i.url&&i.duration>0).slice(0,8).map(i=>({id:i.url.split('v=')[1],title:i.title,len:i.duration}));if(out.length)break}catch(e){}}
  if(!out.length)for(const h of INV){try{const r=await getJSON(`${h}/api/v1/search?q=${encodeURIComponent(q)}&type=video`,6000);
    out=r.slice(0,8).map(i=>({id:i.videoId,title:i.title,len:i.lengthSeconds}));if(out.length)break}catch(e){}}
  // prefer the version whose length matches the lyrics timing; avoid live/cover/remix
  const bad=/live|cover|remix|sped|slowed|karaoke|reaction|8d/i,good=/audio|lyric|official/i;
  out.forEach(v=>{v.score=(v.len?Math.abs(v.len-dur):6)+(bad.test(v.title)?40:0)-(good.test(v.title)?2:0)});
  return out.sort((a,b)=>a.score-b.score);
}

async function gtx(text,extra=''){const r=await getJSON(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=uk&dt=t${extra}&q=${encodeURIComponent(text)}`);return r}
async function translateLines(lines){
  const out=[];let chunk=[];const flush=async()=>{if(!chunk.length)return;
    try{const r=await gtx(chunk.join('\n'));const t=r[0].map(x=>x[0]).join('').split('\n');chunk.forEach((_,i)=>out.push((t[i]||'').trim()))}
    catch(e){for(const l of chunk){try{const m=await getJSON(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(l)}&langpair=en|uk`);out.push(m.responseData.translatedText)}catch(e2){out.push('')}}}
    chunk=[]};
  for(const l of lines){if(chunk.join('\n').length+l.length>1500)await flush();chunk.push(l)}await flush();return out;
}
const wordCache={};
async function wordTr(w){if(wordCache[w])return wordCache[w];

    if(r[1])t=r[1].slice(0,2).map(p=>p[1].slice(0,3).join(', ')).join('; ');return wordCache[w]=t}catch(e){return ''}}

  const key='tr:'+x.id;let tr=store.get(key,null);

  if(song===s){lines.forEach((l,i)=>l.tr={uk:tr[i]||''});setLang(lang)}
}
function ytId(u){const m=String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:null)}
function askVideo(x){return new Promise(res=>{
  const box=document.createElement('div');box.id='ask';box.innerHTML=`<div class="paperbox" style="max-width:520px;margin:20vh auto 0">
    <b style="font:800 16px Unbounded">Не знайшов відео автоматично</b>
    <p style="margin:10px 0;font:14px Onest">Відкрий <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.artistName+' '+x.trackName+' audio')}" target="_blank" rel="noopener">пошук на YouTube</a>, скопіюй посилання на відео і встав сюди:</p>
    <div class="searchbox"><input id="askIn" placeholder="https://youtu.be/…"><button id="askOk">ОК</button></div>
    <button id="askNo" style="margin-top:10px;font:13px Onest;text-decoration:underline">скасувати</button></div>`;
  Object.assign(box.style,{position:'fixed',inset:0,zIndex:80,background:'rgba(14,4,34,.75)',padding:'16px'});document.body.appendChild(box);
  $('#askOk').onclick=()=>{const id=ytId($('#askIn').value.trim());if(!id){toast('Це не схоже на посилання YouTube');return}box.remove();res(id)};
  $('#askNo').onclick=()=>{box.remove();res(null)};
})}
$('#vidBtn').onclick=()=>{const w=$('#ytwrap');w.classList.toggle('mini');$('#vidBtn').classList.toggle('on',w.classList.contains('mini'));$('#vidBtn').textContent=w.classList.contains('mini')?'📺 показати':'📺 відео'};
/* video window: drag anywhere by the yellow tab, resize by the corner */
(function(){const W=$('#ytwrap'),root=document.documentElement;
  const box=store.get('ytbox',null);
  function apply(b,save){const w=Math.max(160,Math.min(innerWidth-10,b.w)),h=w*9/16+10;
    const x=Math.max(-w*.6,Math.min(innerWidth-40,b.x)),y=Math.max(30,Math.min(innerHeight-40,b.y));
    root.style.setProperty('--yx',x+'px');root.style.setProperty('--yy',y+'px');root.style.setProperty('--yw',w+'px');if(save)store.set('ytbox',{x,y,w})}
  if(box)apply(box);
  function cur(){const r=W.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width}}
  function hook(el,mode){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);const s=cur(),sx=e.clientX,sy=e.clientY;
      document.body.classList.add('dragging');W.classList.add('drag');
      const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;apply(mode==='move'?{x:s.x+dx,y:s.y+dy,w:s.w}:{x:s.x,y:s.y,w:s.w+Math.max(dx,dy*16/9)})};
      const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
        document.body.classList.remove('dragging');W.classList.remove('drag');apply(cur(),true)};
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}
  hook($('#ythandle'),'move');hook($('#ygrip'),'size');
  addEventListener('resize',()=>{const b=store.get('ytbox',null);if(b)apply(b)});
})();

/* favourites */
function favs(){return store.get('favs',[])}
function isFav(m){return m&&favs().some(f=>f.id===m.id)}
function refreshFav(){const on=song&&isFav(song.meta);$('#favBtn').classList.toggle('on',!!on);$('#favBtn').textContent=on?'♥':'♡'}
$('#favBtn').onclick=()=>{if(!song||!song.meta)return;let f=favs();
  if(isFav(song.meta)){f=f.filter(x=>x.id!==song.meta.id);toast('Прибрано з обраного')}else{f.unshift(song.meta);toast('♥ Додано в обране')}
  store.set('favs',f);refreshFav();refreshChips()};
async function openById(id,label){$('#loading').classList.remove('hidden');$('#loading div').textContent='♪ відкриваю «'+label+'»…';
  try{const x=await getJSON(`${LRC}/get/${id}`);$('#loading').classList.add('hidden');playTrack(x)}catch(e){$('#loading').classList.add('hidden');toast('Не вдалося відкрити пісню, перевір інтернет')}}

/* recommendations: Deezer (JSONP) related artists + their top tracks */
let jsonpN=0;
function jsonp(url,ms=8000){return new Promise((res,rej)=>{const cb='dz'+(++jsonpN)+Date.now(),sc=document.createElement('script');
  const done=()=>{delete window[cb];sc.remove();clearTimeout(tm)},tm=setTimeout(()=>{done();rej(new Error('timeout'))},ms);
  window[cb]=d=>{done();res(d)};sc.onerror=()=>{done();rej(new Error('net'))};
  sc.src=url+(url.includes('?')?'&':'?')+'output=jsonp&callback='+cb;document.head.appendChild(sc)})}
const DZ='https://api.deezer.com';
const recCache={};
async function getRecs(m){
  if(recCache[m.id])return recCache[m.id];
  const out=[],seen=new Set([(m.artist+m.track).toLowerCase()]);
  const add=(t)=>{const k=(t.artist.name+t.title).toLowerCase();if(seen.has(k))return;seen.add(k);out.push({artist:t.artist.name,track:t.title_short||t.title,cover:t.album&&(t.album.cover_medium||t.album.cover)})};
  try{
    const a=(await jsonp(`${DZ}/search/artist?q=${encodeURIComponent(m.artist)}&limit=1`)).data[0];
    if(a){
      const own=(await jsonp(`${DZ}/artist/${a.id}/top?limit=4`)).data||[];own.slice(0,3).forEach(add);
      const rel=((await jsonp(`${DZ}/artist/${a.id}/related?limit=8`)).data||[]).slice(0,6);
      const tops=await Promise.all(rel.map(r=>jsonp(`${DZ}/artist/${r.id}/top?limit=2`).then(d=>d.data||[]).catch(()=>[])));
      const mixed=[];tops.forEach(t=>t.forEach(x=>mixed.push(x)));mixed.sort(()=>Math.random()-.5).forEach(add);
    }
  }catch(e){}
  if(!out.length){ // fallback: other songs by the same artist from LRCLIB
    try{(await getJSON(`${LRC}/search?artist_name=${encodeURIComponent(m.artist)}`)).filter(x=>x.syncedLyrics).forEach(x=>{const k=(x.artistName+x.trackName).toLowerCase();if(!seen.has(k)){seen.add(k);out.push({artist:x.artistName,track:x.trackName,cover:''})}})}catch(e){}
  }
  return recCache[m.id]=out.slice(0,12);
}
async function showRecs(){
  if(!song||!song.meta)return;const R=$('#recs'),row=$('#recRow');R.classList.remove('hidden');$('#recBtn').classList.add('on');
  row.innerHTML='<div class="rmsg">підбираю пісні…</div>';
  const list=await getRecs(song.meta);
  if(!list.length){row.innerHTML='<div class="rmsg">Не вдалося знайти рекомендації 😿</div>';return}
  row.innerHTML='';list.forEach((r,i)=>{const b=document.createElement('button');b.className='rec';b.style.setProperty('--rr',(i%2?1.5:-1.5)+'deg');
    b.innerHTML=(r.cover?`<img src="${r.cover}" alt="" loading="lazy">`:'<img src="st_cassette.webp" alt="" style="object-fit:contain">')+`<b>${esc(r.track)}</b><small>${esc(r.artist)}</small>`;
    b.onclick=()=>playRec(r);row.appendChild(b)});
}
async function playRec(r){$('#loading').classList.remove('hidden');$('#loading div').textContent='♪ шукаю текст…';
  try{const list=await searchSongs(`${r.artist} — ${r.track}`);$('#loading').classList.add('hidden');
    const x=list.find(x=>x.syncedLyrics)||list[0];if(!x){toast('Для цієї пісні не знайшов тексту 😿');return}
    if(player)player.destroy();playTrack(x)}catch(e){$('#loading').classList.add('hidden');toast('Не вдалося, перевір інтернет')}}
$('#recBtn').onclick=()=>{if($('#recs').classList.contains('hidden'))showRecs();else{$('#recs').classList.add('hidden');$('#recBtn').classList.remove('on')}};
$('#recsClose').onclick=()=>{$('#recs').classList.add('hidden');$('#recBtn').classList.remove('on')};

$('#ownGo').onclick=()=>{
  const f=$('#ownAudio').files[0];const raw=$('#ownLrc').value;
  if(!f){toast('Обери аудіофайл');return}
  const lines=parseLRC(raw);if(!lines.length){toast('Встав текст у форматі LRC: [хх:сс.xx] рядок');return}
  const tr=$('#ownTr').value.split('\n').map(s=>s.trim()).filter(Boolean);
  lines.forEach((l,i)=>l.tr={mine:tr[i]||''});
  const s={id:'own',title:f.name.replace(/\.[^.]+$/,'').slice(0,28),artist:'твій файл',lines,langs:tr.length?[['mine','ПЕРЕКЛАД']]:[],gloss:{}};
  openSong(s,new FilePlayer(URL.createObjectURL(f),lines[lines.length-1].t+8,false));
};
function parseLRC(txt){
  const out=[];txt.split(/\r?\n/).forEach(row=>{const tags=[...row.matchAll(/\[(\d+):(\d+(?:[.:]\d+)?)\]/g)];if(!tags.length)return;
    const text=row.replace(/\[[^\]]*\]/g,'').trim();if(!text)return;
    tags.forEach(m=>out.push({t:+m[1]*60+parseFloat(m[2].replace(':','.')),en:text}))});
  return out.sort((a,b)=>a.t-b.t);
}
